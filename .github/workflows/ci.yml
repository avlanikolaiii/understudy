name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Website build and QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: apps/web
        run: node build.mjs
      - name: Static QA
        working-directory: apps/web
        run: node qa.mjs

  mac:
    # Each runner is a fresh Mac nobody has used: no app data, no server config (Sample mode),
    # and no notch (the drop-down fallback). That is the first run on any person's MacBook.
    name: Mac · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Toolchain
        run: sw_vers && swift --version
      - uses: actions/cache@v4
        with:
          path: apps/mac/.build
          key: spm-${{ matrix.os }}-${{ hashFiles('apps/mac/Package.resolved') }}
      - name: Build the app
        run: apps/mac/scripts/bundle.sh
      - name: Signature
        run: codesign --verify --deep --strict apps/mac/build/Understudy.app
      - name: QA (checks, simulated users, website, held-out evals)
        run: python3 qa/run.py --skip-build --sessions 80 --seeds 1,2
      - name: First launch
        run: |
          before=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -c Understudy || true)
          open apps/mac/build/Understudy.app
          sleep 10
          pgrep -x Understudy >/dev/null || { echo "Understudy quit during its first 10 seconds"; exit 1; }
          after=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -c Understudy || true)
          [ "$after" = "$before" ] || { echo "Understudy left a crash report"; exit 1; }
          pkill -x Understudy
      - name: Gatekeeper (informational)
        # Ad-hoc signed builds can't pass Gatekeeper yet; distribution needs Developer ID + notarization.
        run: spctl --assess --type execute apps/mac/build/Understudy.app || echo "::notice::Not notarized yet, expected until Developer ID signing is set up."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: |
            qa/out/report.html
            qa/out/run.json
            qa/out/self-test-*/*.png
          if-no-files-found: ignore
